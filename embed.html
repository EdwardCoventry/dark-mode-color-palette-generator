<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="color-scheme" content="dark light">
    <meta name="darkreader" content="uuid">
    <meta name="darkreader-lock">
<meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Embed redirect for Color Palette Generator.">
    <link rel="canonical" href="https://dark-mode-color-palette-generator.netlify.app/apps/color-palette-generator">
    <title>Embed: color-palette-generator</title>
    <script>
        (function () {
            var isLocal = /localhost|127\.0\.0\.1/.test(window.location.host);
            var target = isLocal ? '/color-palette-generator.html' : '/apps/color-palette-generator';
            var qp = new URLSearchParams(window.location.search || '');
            if (!qp.has('embed')) qp.set('embed', '1');
            var qs = qp.toString();
            var next = target + (qs ? ('?' + qs) : '') + (window.location.hash || '');
            var current = window.location.pathname + window.location.search + window.location.hash;
            if (current !== next) window.location.replace(next);
        })();
    </script>
</head>
<body>
<noscript>
    <p>The embedded palette generator requires JavaScript.</p>
</noscript>
</body>
</html>
