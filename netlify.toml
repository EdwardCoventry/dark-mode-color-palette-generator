[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[dev]
command = "npm run dev"
targetPort = 5406
port = 8806
functionsPort = 7406
autoLaunch = false

# ---- apps variant ----

# Redirect the legacy HTML path under /apps to site root
[[redirects]]
from = "/apps/color-palette-generator.html"
to   = "/"
status = 301

# Serve the palette UI for pretty /apps path
[[redirects]]
from = "/apps/color-palette-generator"
to   = "/color-palette-generator.html"
status = 200

# Keep dark-mode alias (if needed)
[[redirects]]
from = "/apps/dark-mode-color-palette-generator"
to   = "/index.html"
status = 200

[[redirects]]
from = "/apps/dark-mode-color-palette-generator/assets/*"
to   = "/assets/:splat"
status = 200

[[redirects]]
from = "/apps/dark-mode-color-palette-generator/*"
to   = "/index.html"
status = 200

# ---- embed variant ----

[[redirects]]
from = "/embed/dark-mode-color-palette-generator"
to   = "/embed.html"
status = 200

[[redirects]]
from = "/embed/dark-mode-color-palette-generator/*"
to   = "/embed.html"
status = 200

[[redirects]]
from = "/embed/color-palette-generator"
to   = "/embed.html"
status = 200

[[redirects]]
from = "/embed/color-palette-generator/*"
to   = "/embed.html"
status = 200

[[headers]]
for = "/embed"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/embed/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/version.json"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/apps/color-palette-generator/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
