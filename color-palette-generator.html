<!DOCTYPE html>
<html lang="en" class="palette-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="darkreader" content="uuid">
  <meta name="darkreader-lock">
  <meta name="description" content="Generate dark-mode-friendly color palettes with lockable columns and quick copy controls.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dark-mode-color-palette-generator.netlify.app/apps/color-palette-generator">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Color Palette Generator">
  <meta property="og:title" content="Color Palette Generator">
  <meta property="og:description" content="Generate dark-mode-friendly color palettes with lockable columns and quick copy controls.">
  <meta property="og:url" content="https://dark-mode-color-palette-generator.netlify.app/apps/color-palette-generator">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Color Palette Generator">
  <meta name="twitter:description" content="Generate dark-mode-friendly color palettes with lockable columns and quick copy controls.">
  <title>Palette Generator</title>
  <script>
    (function () {
      var host = (window.location.hostname || '').toLowerCase();
      if (host === 'dark-mode-color-palette-generator.netlify.app') return;
      var robots = document.querySelector('meta[name="robots"]');
      robots.setAttribute('content', 'noindex, nofollow');
    })();
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Color Palette Generator",
      "url": "https://dark-mode-color-palette-generator.netlify.app/apps/color-palette-generator",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "description": "Generate dark-mode-friendly color palettes with lockable columns and quick copy controls."
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Color Palette Generator",
      "alternateName": "dark-mode-color-palette-generator.netlify.app",
      "url": "https://dark-mode-color-palette-generator.netlify.app/apps/color-palette-generator"
    }
  </script>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <main id="main-content" class="container" aria-labelledby="palette-generator-title">
    <section class="controls" aria-labelledby="palette-generator-title palette-controls-title">
      <h1 id="palette-generator-title" class="visually-hidden">Color Palette Generator</h1>
      <h2 id="palette-controls-title" class="visually-hidden">Palette controls</h2>
      <button id="generateBtn" class="button" type="button" aria-label="Generate a new color palette">Generate</button>
    </section>

    <section class="color-columns" aria-label="Generated palette">
      <div class="color-col" id="col0" data-index="0" data-locked="false" title="Click to copy hex" role="group" aria-label="Palette column 1">
        <div class="info">
          <button class="lock-btn" type="button" aria-pressed="false" aria-label="Lock column 1" title="Lock (1)"><ph-lock-open class="lock-icon lock-icon--open" size="1em" weight="bold" aria-hidden="true"></ph-lock-open><ph-lock class="lock-icon lock-icon--closed" size="1em" weight="fill" aria-hidden="true" hidden></ph-lock></button>
          <button class="hex copy-btn" type="button"></button>
          <div class="name"></div>
          <span class="copy-status visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="color-col" id="col1" data-index="1" data-locked="false" title="Click to copy hex" role="group" aria-label="Palette column 2">
        <div class="info">
          <button class="lock-btn" type="button" aria-pressed="false" aria-label="Lock column 2" title="Lock (2)"><ph-lock-open class="lock-icon lock-icon--open" size="1em" weight="bold" aria-hidden="true"></ph-lock-open><ph-lock class="lock-icon lock-icon--closed" size="1em" weight="fill" aria-hidden="true" hidden></ph-lock></button>
          <button class="hex copy-btn" type="button"></button>
          <div class="name"></div>
          <span class="copy-status visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="color-col" id="col2" data-index="2" data-locked="false" title="Click to copy hex" role="group" aria-label="Palette column 3">
        <div class="info">
          <button class="lock-btn" type="button" aria-pressed="false" aria-label="Lock column 3" title="Lock (3)"><ph-lock-open class="lock-icon lock-icon--open" size="1em" weight="bold" aria-hidden="true"></ph-lock-open><ph-lock class="lock-icon lock-icon--closed" size="1em" weight="fill" aria-hidden="true" hidden></ph-lock></button>
          <button class="hex copy-btn" type="button"></button>
          <div class="name"></div>
          <span class="copy-status visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="color-col" id="col3" data-index="3" data-locked="false" title="Click to copy hex" role="group" aria-label="Palette column 4">
        <div class="info">
          <button class="lock-btn" type="button" aria-pressed="false" aria-label="Lock column 4" title="Lock (4)"><ph-lock-open class="lock-icon lock-icon--open" size="1em" weight="bold" aria-hidden="true"></ph-lock-open><ph-lock class="lock-icon lock-icon--closed" size="1em" weight="fill" aria-hidden="true" hidden></ph-lock></button>
          <button class="hex copy-btn" type="button"></button>
          <div class="name"></div>
          <span class="copy-status visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/js/pages/color-palette-generator.js"></script>
</body>
</html>
